<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d12" />
      <stop offset="50%" stop-color="#141419" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8BC3A" />
      <stop offset="100%" stop-color="#C9A227" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#glow)" />

  <!-- Browser Window Frame -->
  <g transform="translate(60, 45)">
    <!-- Window Drop Shadow / Outer Card -->
    <rect width="1080" height="585" rx="16" fill="#111116" stroke="#2a2a35" stroke-width="1.5" />
    
    <!-- Window Header -->
    <rect width="1080" height="48" rx="16" fill="#181820" />
    <rect y="32" width="1080" height="16" fill="#181820" />
    <line x1="0" y1="48" x2="1080" y2="48" stroke="#2a2a35" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="28" cy="24" r="6" fill="#ff5f56" />
    <circle cx="48" cy="24" r="6" fill="#ffbd2e" />
    <circle cx="68" cy="24" r="6" fill="#27c93f" />

    <!-- URL Bar -->
    <rect x="110" y="12" width="460" height="24" rx="6" fill="#0d0e12" stroke="#252630" stroke-width="1" />
    <text x="130" y="28" fill="#888899" font-family="'Inter', sans-serif" font-size="11">https://krishna-website-alpha.vercel.app</text>

    <!-- Page Content Preview -->
    <g transform="translate(48, 80)">
      <!-- Mini Brand Tag -->
      <rect width="110" height="24" rx="12" fill="#C9A227" fill-opacity="0.15" stroke="#C9A227" stroke-opacity="0.3" />
      <text x="14" y="16" fill="#E8BC3A" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="1.5">PORTFOLIO</text>

      <!-- Headline -->
      <text x="0" y="70" fill="#ffffff" font-family="'Playfair Display', serif" font-size="38" font-weight="700">Krishna Gupta</text>
      <text x="0" y="105" fill="#C9A227" font-family="'Playfair Display', serif" font-size="28" font-style="italic">Creative Director &amp; Designer</text>

      <!-- Description lines -->
      <text x="0" y="145" fill="#8E8E9F" font-family="'Inter', sans-serif" font-size="14">Crafting distinct brand identities, interactive digital experiences,</text>
      <text x="0" y="168" fill="#8E8E9F" font-family="'Inter', sans-serif" font-size="14">and conversion-driven systems for visionary clients worldwide.</text>

      <!-- CTA Button -->
      <rect y="200" width="150" height="40" rx="20" fill="url(#goldGrad)" />
      <text x="32" y="225" fill="#0A0A0A" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Explore Work →</text>

      <!-- Mini Project Grid inside the mockup -->
      <g transform="translate(540, 20)">
        <!-- Card 1 -->
        <rect width="210" height="230" rx="12" fill="#171822" stroke="#2e3040" stroke-width="1" />
        <rect x="15" y="15" width="180" height="110" rx="8" fill="#222436" />
        <circle cx="105" cy="70" r="22" fill="#C9A227" fill-opacity="0.2" />
        <text x="97" y="76" fill="#E8BC3A" font-size="18">✦</text>
        <text x="15" y="150" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Fintech Platform</text>
        <text x="15" y="170" fill="#75758a" font-family="'Inter', sans-serif" font-size="11">Brand &amp; Web App</text>
        <rect x="15" y="190" width="55" height="18" rx="9" fill="#2a2c3e" />
        <text x="24" y="203" fill="#C9A227" font-size="9" font-family="'Inter', sans-serif">2026</text>

        <!-- Card 2 -->
        <g transform="translate(230, 0)">
          <rect width="210" height="230" rx="12" fill="#171822" stroke="#2e3040" stroke-width="1" />
          <rect x="15" y="15" width="180" height="110" rx="8" fill="#222436" />
          <circle cx="105" cy="70" r="22" fill="#C9A227" fill-opacity="0.2" />
          <text x="97" y="76" fill="#E8BC3A" font-size="18">★</text>
          <text x="15" y="150" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Luxury D2C Fragrance</text>
          <text x="15" y="170" fill="#75758a" font-family="'Inter', sans-serif" font-size="11">Shopify Storefront</text>
          <rect x="15" y="190" width="55" height="18" rx="9" fill="#2a2c3e" />
          <text x="24" y="203" fill="#C9A227" font-size="9" font-family="'Inter', sans-serif">2026</text>
        </g>
      </g>
    </g>
  </g>
</svg>
